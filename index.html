<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLAÌA CLUB</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { overflow-x: hidden; }

    :root{
      --gap: 28px;
      --icon-size: 30px;
      --icon-color: #362114;
    }

    /* The image fills the section and SCROLLS with the page */
    .hero{
      width: 100vw;
      height: 200vh; /* >= 100vh so there's something to scroll */
      background-image: url("assets/7.jpg");
      background-size: cover;            /* no white bars on the sides */
      background-position: center bottom;/* start near the bottom if your text is down there */
      background-repeat: no-repeat;
      /* NOTE: background-attachment stays default 'scroll' (NOT fixed) */
    }

    /* Icons stay visible while the background scrolls */
    .icons{
      position: fixed;
      top: calc(max(var(--gap), env(safe-area-inset-top)));
      left: calc(max(var(--gap), env(safe-area-inset-left)));
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .icons a{
      display: inline-flex;
      width: var(--icon-size);
      height: var(--icon-size);
    }

    .icons svg{
      width: 100%;
      height: 100%;
      stroke: var(--icon-color);
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity .2s ease;
    }
    .icons a:hover svg{ opacity: .7; }

    @media (max-width: 420px){
      :root{ --gap: 24px; --icon-size: 28px; }
      .hero{ height: 120vh; } /* lighter scroll on small screens */
    }

    @media (min-width: 1440px){
      .hero{ height: 240vh; } /* extra scroll on big laptops/monitors */
    }
  </style>
</head>
<body>
  <div class="icons" aria-label="Links">
    <a href="https://instagram.com/solaiaclub" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
    </a>
    <a href="#" onclick="window.location='mailto:'+'solaiaclub'+'@'+'proton.me';return false;" aria-label="Email">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
        <polyline points="3 7,12 13,21 7"/>
      </svg>
    </a>
  </div>

  <!-- Scrollable background image -->
  <section class="hero" aria-hidden="true"></section>
</body>
</html>
