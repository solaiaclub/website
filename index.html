<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLAÌA CLUB</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { overflow-x: hidden; }

    :root{
      --gap: 28px;
      --icon-size: 30px;
      --icon-color: #362114;
    }

    /* Scrolls naturally with the page */
    .hero{
      position: relative;
      width: 100vw;    /* fill screen width */
    }

    /* Full image visible, no side bars, maintains aspect ratio */
    .hero img{
      display: block;
      width: 100vw;    /* no white space on the sides */
      height: auto;    /* keep aspect ratio so bottom isn't cropped */
    }

    /* Icons stay fixed while you scroll the image */
    .icons{
      position: fixed;
      top: calc(max(var(--gap), env(safe-area-inset-top)));
      left: calc(max(var(--gap), env(safe-area-inset-left)));
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .icons a{
      display: inline-flex;
      width: var(--icon-size);
      height: var(--icon-size);
    }

    .icons svg{
      width: 100%;
      height: 100%;
      stroke: var(--icon-color);
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity .2s ease;
    }
    .icons a:hover svg{ opacity: .7; }

    @media (max-width: 420px){
      :root{ --gap: 24px; --icon-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="icons" aria-label="Links">
    <a href="https://instagram.com/solaiaclub" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
    </a>
    <a href="#" onclick="window.location='mailto:'+'solaiaclub'+'@'+'proton.me';return false;" aria-label="Email">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
        <polyline points="3 7,12 13,21 7"/>
      </svg>
    </a>
  </div>

  <!-- Image fills width, full height remains viewable by scrolling -->
  <section class="hero">
    <img src="assets/website_v1.jpg" alt="Background image" loading="eager" />
  </section>
</body>
</html>
