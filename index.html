<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLAÌA CLUB</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { overflow-x: hidden; }

    :root{
      --gap: 28px;
      --icon-size: 30px;
      --icon-color: #362114;
    }

    .hero{
      position: relative;
      width: 100vw;
    }

    .hero img{
      display: block;
      width: 100vw;
      height: auto;
    }

    /* Fixed icons (top left) */
    .icons{
      position: fixed;
      top: calc(max(var(--gap), env(safe-area-inset-top)));
      left: calc(max(var(--gap), env(safe-area-inset-left)));
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .icons a{
      display: inline-flex;
      width: var(--icon-size);
      height: var(--icon-size);
    }

    .icons svg{
      width: 100%;
      height: 100%;
      stroke: var(--icon-color);
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity .2s ease;
    }

    .icons a:hover svg{ opacity: .7; }

    /* Scroll indicator arrow */
    .scroll-arrow{
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      stroke: var(--icon-color);
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 1;
      transition: opacity 0.35s ease;
      z-index: 9;
      pointer-events: none;
    }

    .scroll-arrow.hidden {
      opacity: 0;
    }

    @media (max-width: 420px){
      :root{ --gap: 24px; --icon-size: 28px; }
    }
  </style>
</head>
<body>
  <!-- Fixed icons -->
  <div class="icons" aria-label="Links">
    <a href="https://instagram.com/solaiaclub" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
    </a>
    <a href="#" onclick="window.location='mailto:'+'solaiaclub'+'@'+'proton.me';return false;" aria-label="Email">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
        <polyline points="3 7,12 13,21 7"/>
      </svg>
    </a>
  </div>

  <!-- Minimalist scroll indicator -->
  <svg class="scroll-arrow" viewBox="0 0 24 24" aria-hidden="true">
    <polyline points="6 9 12 15 18 9"/>
  </svg>

  <!-- Image fills width -->
  <section class="hero">
    <img src="assets/website_v2.jpg" alt="Background image" loading="eager" />
  </section>

  <script>
    const arrow = document.querySelector('.scroll-arrow');

    function toggleArrow() {
      const doc = document.documentElement;
      const scrollY = window.scrollY || doc.scrollTop;
      const viewportH = window.innerHeight;
      const fullH = doc.scrollHeight;

      // true if user is basically at bottom (2px tolerance)
      const atBottom = Math.ceil(scrollY + viewportH) >= fullH - 2;

      if (atBottom) {
        arrow.classList.add('hidden');
      } else {
        arrow.classList.remove('hidden');
      }
    }

    // run on load and on scroll
    window.addEventListener('scroll', toggleArrow);
    window.addEventListener('load', toggleArrow);
  </script>
</body>
</html>
