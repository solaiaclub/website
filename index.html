<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLAÌA CLUB</title>
  <style>
    /* Minimal reset */
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }

    :root{
      --gap: 28px;          /* edge offset for top/left */
      --icon-size: 30px;    /* icon box size */
      --icon-color: #362114;
    }

    .hero{
      position: relative;
      height: 100vh;
      width: 100%;
    }

    .hero img{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Icons top-left */
    .icons{
      position: absolute;
      top: calc(max(var(--gap), env(safe-area-inset-top)));
      left: calc(max(var(--gap), env(safe-area-inset-left)));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      z-index: 1;
    }

    .icons a{
      display: inline-flex;
      width: var(--icon-size);
      height: var(--icon-size);
    }

    .icons svg{
      width: 100%;
      height: 100%;
      stroke: var(--icon-color);
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity .2s ease;
    }

    .icons a:hover svg{ opacity: .7; }

    /* Slightly tighter layout on very small screens */
    @media (max-width: 420px){
      :root{ --gap: 24px; --icon-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="assets/7.jpg" alt="Background" loading="eager" />

    <div class="icons" aria-label="Links">
      <a href="https://instagram.com/solaiaclub" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1"/>
        </svg>
      </a>

      <a href="#" onclick="window.location='mailto:' + 'solaiaclub' + '@' + 'proton.me'; return false;" aria-label="Email">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
          <polyline points="3 7,12 13,21 7"/>
        </svg>
      </a>
    </div>
  </div>
</body>
</html>
